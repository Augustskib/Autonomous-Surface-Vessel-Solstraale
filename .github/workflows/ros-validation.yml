name: ASV ROS validation
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'scripts/**', 'tests/**', '.github/workflows/ros-validation.yml', '.dockerignore']
permissions:
  contents: read
jobs:
  jazzy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build packages and dependencies
        run: docker build -f scripts/validation/Dockerfile -t asv-validation:jazzy .
      - name: Test packages, launch descriptions and DDS
        run: docker run --rm --network none asv-validation:jazzy
